{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ремонт рядом{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container py-3">
            <a href="{% url 'homepage:index' %}" class="brand-link">
                <img src="{% static 'homepage/img/logo.svg' %}" alt="Ремонт рядом" class="site-logo">
                <span>Ремонт рядом</span>
            </a>
        </div>
        {% include "includes/navigation.html" %}
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> Ремонт рядом</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
